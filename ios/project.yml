name: GetGrilled
options:
  bundleIdPrefix: com.getgrilled
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    from: 0.4.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: 5.0.0
  Languages:
    path: Languages

targets:
  GetGrilled:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: GetGrilled/Sources
      - path: GetGrilled/Resources
    info:
      path: GetGrilled/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: GetGrilled
        NSMicrophoneUsageDescription: "Used to record your spoken answers during mock interviews. Recordings are transcribed on this device and never uploaded."
        NSSpeechRecognitionUsageDescription: "Used to transcribe your spoken answers into text during mock interviews, entirely on this device."
        NSCameraUsageDescription: "Shows your own camera feed to you during practice, like a mirror — it's never recorded or sent anywhere."
        UIAppFonts:
          - Onest-Regular.ttf
          - Onest-Medium.ttf
          - Onest-SemiBold.ttf
          - Onest-Bold.ttf
          - Onest-ExtraBold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - IBMPlexMono-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.getgrilled.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: GetGrilled/GetGrilled.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: HZAXR4K757
    dependencies:
      - package: Runestone
      - package: Supabase
      - package: RevenueCat
      - package: Languages
        product: RunestoneJavaScriptLanguage
      - package: Languages
        product: RunestonePythonLanguage
